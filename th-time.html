<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hong Kong Clock</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap');

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Roboto', sans-serif;
            background-color: #000000;
        }
        .clock {
            text-align: center;
            font-size: 4em;
            color: #FFFFFF;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        #time {
            font-size: 1.5em;
            font-weight: 400;
            background-color: #FFFFFF;
            color: #000000;
            border-radius: 25px;
            padding: 10px 45px;
            display: inline-block;
            width: fit-content;
            margin: 0 auto 10px;
            position: relative;
            cursor: pointer;
        }
        #date {
            margin-bottom: -10px;
        }
        .day {
            display: flex;
            justify-content: center;
            align-items: end;
            gap: 0.5em;
        }
        #period {
            position: absolute;
            bottom: 0;
            right: 0;
            font-size: 0.25em;
            padding: 0 15px 3px 0;
            color: #000000;
        }
        #remaining {
            position: absolute;
            top: 0;
            right: 0;
            font-size: 0.2em;
            padding: 3px 15px 0 0;
            color: #000000;
        }
        #mode {
            font-size: 0.25em;
            background-color: #FFFFFF;
            color: #000000;
            border: none;
            border-radius: 5px;
            padding: 10px;
            width: 100px;
            align-self: center;
        }
        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        #modalContent {
            background: white;
            color: black;
            padding: 15px;
            border-radius: 10px;
            max-width: 80%;
            overflow: auto;
            position: relative;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid black;
            padding: 4px 10px;
            text-align: center;
        }
        #closeModal {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 24px;
            color: #000;
        }
        .highlight {
            background-color: #ffff00;
        }
        #modalTitle {
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .left, .right {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .clock.landscape {
            flex-direction: row;
            gap: 20px;
        }
        .clock.landscape .day {
            flex-direction: column;
            align-items: center;
            gap: 0;
        }
        .toggle-switch {
            position: relative;
            width: 30px;
            height: 15px;
        }
        #layoutSwitch {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .toggle-switch label {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 15px;
        }
        .toggle-switch label:before {
            position: absolute;
            content: "";
            height: 11px;
            width: 11px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        #layoutSwitch:checked + label {
            background-color: #2196F3;
        }
        #layoutSwitch:checked + label:before {
            transform: translateX(15px);
        }
        .controls {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="clock">
        <div class="left">
            <div class="controls">
                <select id="mode">
                    <option value="normal">Normal</option>
                    <option value="summer">Summer</option>
                    <option value="test">Test</option>
                </select>
                <div class="toggle-switch">
                    <input type="checkbox" id="layoutSwitch">
                    <label for="layoutSwitch"></label>
                </div>
            </div>
            <div id="time"><span id="time-text"></span><div id="remaining" style="display: none;"></div><div id="period" style="display: none;"></div></div>
        </div>
        <div class="right">
            <div id="date"></div>
            <div class="day"> 
                <div id="weekday"></div>
                <div id="cycleDay" style="display: none; cursor: pointer;"></div>
            </div>
        </div>
    </div>
    <div id="modal">
        <div id="modalContent">
            <div id="modalTitle"></div>
            <span id="closeModal">&times;</span>
            <table id="periodTable">
                <thead>
                    <tr>
                        <th>Start</th>
                        <th>End</th>
                        <th>Period</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script>
        const schedules = {
            normal: [
                { start: 8*60 + 40, end: 9*60 + 20, name: 'P1' },
                { start: 9*60 + 20, end: 10*60 + 0, name: 'P2' },
                { start: 10*60 + 0, end: 10*60 + 40, name: 'P3' },
                { start: 10*60 + 40, end: 11*60 + 0, name: '小息' },
                { start: 11*60 + 0, end: 11*60 + 40, name: 'P4' },
                { start: 11*60 + 40, end: 12*60 + 20, name: 'P5' },
                { start: 12*60 + 20, end: 13*60 + 0, name: 'P6' },
                { start: 13*60 + 0, end: 14*60 + 15, name: 'Lunch' },
                { start: 14*60 + 15, end: 14*60 + 55, name: 'P7' },
                { start: 14*60 + 55, end: 15*60 + 35, name: 'P8' }
            ],
            summer: [
                { start: 8*60 + 15, end: 8*60 + 50, name: 'P1' },
                { start: 8*60 + 50, end: 9*60 + 25, name: 'P2' },
                { start: 9*60 + 25, end: 10*60 + 0, name: 'P3' },
                { start: 10*60 + 0, end: 10*60 + 15, name: '小息' },
                { start: 10*60 + 15, end: 10*60 + 50, name: 'P4' },
                { start: 10*60 + 50, end: 11*60 + 25, name: 'P5' },
                { start: 11*60 + 25, end: 12*60 + 0, name: 'P6' },
                { start: 12*60 + 0, end: 12*60 + 15, name: '小息' },
                { start: 12*60 + 15, end: 12*60 + 50, name: 'P7' },
                { start: 12*60 + 50, end: 13*60 + 25, name: 'P8' }
            ],
            test: [
                { start: 9*60 + 20, end: 9*60 + 55, name: 'P1' },
                { start: 9*60 + 55, end: 10*60 + 30, name: 'P2' },
                { start: 10*60 + 30, end: 11*60 + 5, name: 'P3' },
                { start: 11*60 + 5, end: 11*60 + 25, name: '小息' },
                { start: 11*60 + 25, end: 12*60 + 0, name: 'P4' },
                { start: 12*60 + 0, end: 12*60 + 35, name: 'P5' },
                { start: 12*60 + 35, end: 13*60 + 10, name: 'P6' },
                { start: 13*60 + 10, end: 14*60 + 25, name: 'Lunch' },
                { start: 14*60 + 25, end: 15*60 + 0, name: 'P7' },
                { start: 15*60 + 0, end: 15*60 + 35, name: 'P8' }
            ]
        };

        function minutesToTime(minutes) {
            const hours = Math.floor(minutes / 60);
            const mins = minutes % 60;
            return `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}`;
        }

        function showPeriods() {
            const mode = document.getElementById('mode').value;
            const modeTitle = mode.charAt(0).toUpperCase() + mode.slice(1) + ' Schedule';
            document.getElementById('modalTitle').textContent = modeTitle;

            const nowHK = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' }));
            const hours = nowHK.getHours();
            const minutes = nowHK.getMinutes();
            const totalMinutes = hours * 60 + minutes;

            const periods = schedules[mode];
            const tbody = document.querySelector('#periodTable tbody');
            tbody.innerHTML = '';
            periods.forEach(period => {
                const row = document.createElement('tr');
                if (totalMinutes >= period.start && totalMinutes < period.end) {
                    row.classList.add('highlight');
                }
                row.innerHTML = `
                    <td>${minutesToTime(period.start)}</td>
                    <td>${minutesToTime(period.end)}</td>
                    <td>${period.name}</td>
                `;
                tbody.appendChild(row);
            });
            document.getElementById('modal').style.display = 'flex';
        }

        function updateClock() {
            const now = new Date();
            const options = { timeZone: 'Asia/Hong_Kong' };
            
            // Time in HH:MM am/pm
            const timeString = now.toLocaleTimeString('en-US', {
                ...options,
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
            
            // Date in YYYY/MM/DD or MM/DD based on landscape mode
            let dateString;
            if (document.querySelector('.clock').classList.contains('landscape')) {
                dateString = now.toLocaleDateString('en-US', { ...options, month: '2-digit', day: '2-digit' });
            } else {
                dateString = now.toLocaleDateString('en-CA', options).replace(/-/g, '/');
            }
            
            // Weekday in Chinese
            const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            const weekdayString = weekdays[now.getDay()];
            
            // Cycle Day calculation
            const [year, month, day] = now.toLocaleDateString('en-CA', options).split('-').map(Number);
            const cycleDays = {
                '2026-09-02': 1, '2026-09-03': 2, '2026-09-04': 3, '2026-09-07': 4, '2026-09-08': 5, '2026-09-09': 6, '2026-09-10': 1, '2026-09-11': 2, '2026-09-14': 3, '2026-09-15': 4, '2026-09-16': 5, '2026-09-17': 6, '2026-09-18': 1, '2026-09-21': 2, '2026-09-22': 3, '2026-09-23': 4, '2026-09-24': 5, '2026-09-25': 6, '2026-09-28': 1, '2026-09-29': 2, '2026-09-30': 3, '2026-10-02': 4, '2026-10-05': 5, '2026-10-06': 6, '2026-10-07': 1, '2026-10-08': 2, '2026-10-09': 3, '2026-10-12': 4, '2026-10-13': 5, '2026-10-15': 6, '2026-10-16': 1, '2026-10-20': 2, '2026-10-21': 3, '2026-10-22': 4, '2026-10-23': 5, '2026-10-26': 6, '2026-10-27': 1, '2026-10-28': 2, '2026-10-29': 3, '2026-10-30': 4, '2026-11-02': 5, '2026-11-03': 6, '2026-11-04': 1, '2026-11-05': 2, '2026-11-06': 3, '2026-11-12': 4, '2026-11-13': 5, '2026-11-16': 6, '2026-11-17': 1, '2026-11-18': 2, '2026-11-19': 3, '2026-11-23': 4, '2026-11-24': 5, '2026-11-25': 6, '2026-11-26': 1, '2026-11-27': 2, '2026-11-30': 3, '2026-12-01': 4, '2026-12-02': 5, '2026-12-03': 6, '2026-12-04': 1, '2026-12-07': 2, '2026-12-08': 3, '2026-12-09': 4, '2026-12-10': 5, '2026-12-11': 6, '2026-12-14': 1, '2026-12-15': 2, '2026-12-16': 3, '2026-12-17': 4, '2027-01-04': 5, '2027-01-05': 6, '2027-01-06': 1, '2027-01-07': 2, '2027-01-08': 3, '2027-01-11': 4, '2027-01-12': 5, '2027-01-13': 6, '2027-01-14': 1, '2027-01-15': 2, '2027-01-18': 3, '2027-01-19': 4, '2027-01-20': 5, '2027-01-21': 6, '2027-01-25': 1, '2027-01-26': 2, '2027-01-27': 3, '2027-01-28': 4, '2027-01-29': 5, '2027-02-01': 6, '2027-02-02': 1, '2027-02-15': 2, '2027-02-16': 3, '2027-02-17': 4, '2027-02-18': 5, '2027-02-19': 6, '2027-02-23': 1, '2027-02-24': 2, '2027-02-25': 3, '2027-02-26': 4, '2027-03-01': 5, '2027-03-02': 6, '2027-03-03': 1, '2027-03-04': 2, '2027-03-05': 3, '2027-03-08': 4, '2027-03-09': 5, '2027-03-10': 6, '2027-03-11': 1, '2027-03-12': 2, '2027-03-15': 3, '2027-03-16': 4, '2027-03-17': 5, '2027-03-18': 6, '2027-03-19': 1, '2027-03-22': 2, '2027-03-23': 3, '2027-03-24': 4, '2027-04-06': 5, '2027-04-07': 6, '2027-04-08': 1, '2027-04-09': 2, '2027-04-12': 3, '2027-04-13': 4, '2027-04-14': 5, '2027-04-15': 6, '2027-04-16': 1, '2027-04-19': 2, '2027-04-20': 3, '2027-04-21': 4, '2027-04-22': 5, '2027-04-23': 6, '2027-04-26': 1, '2027-04-27': 2, '2027-04-28': 3, '2027-04-29': 4, '2027-04-30': 5, '2027-05-03': 6, '2027-05-04': 1, '2027-05-05': 2, '2027-05-06': 3, '2027-05-07': 4, '2027-05-10': 5, '2027-05-11': 6, '2027-05-12': 1, '2027-05-14': 2, '2027-05-17': 3, '2027-05-18': 4, '2027-05-19': 5, '2027-05-20': 6, '2027-05-21': 1, '2027-05-24': 2, '2027-05-25': 3, '2027-05-26': 4, '2027-05-27': 5, '2027-05-28': 6, '2027-05-31': 1, '2027-06-01': 2, '2027-06-02': 3, '2027-06-03': 4, '2027-06-04': 5, '2027-06-07': 6, '2027-06-08': 1, '2027-06-10': 2, '2027-06-11': 3, '2027-06-14': 4, '2027-06-15': 5, '2027-06-16': 6, '2027-06-17': 1, '2027-06-18': 2, '2027-06-21': 3, '2027-06-22': 4, '2027-06-23': 5, '2027-06-24': 6, '2027-06-25': 1, '2027-06-28': 2, '2027-06-29': 3, '2027-06-30': 4, '2027-07-02': 5, '2027-07-05': 6, '2027-07-06': 1, '2027-07-07': 2, '2027-07-08': 3, '2027-07-09': 4, '2027-07-12': 5, '2027-07-13': 6
            };
            const dateKey = `${year}-${month.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
            const cycleDay = cycleDays[dateKey];
            const cycleDayElement = document.getElementById('cycleDay');
            if (cycleDay) {
                cycleDayElement.style.display = 'block';
                cycleDayElement.textContent = `Day${cycleDay}`;
            } else {
                cycleDayElement.style.display = 'none';
            }

            // Period calculation
            const nowHK = new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Hong_Kong' }));
            const hours = nowHK.getHours();
            const minutes = nowHK.getMinutes();
            const totalMinutes = hours * 60 + minutes;

            const mode = document.getElementById('mode').value;
            const periods = schedules[mode];

            let currentPeriod = '';
            let remainingMinutes = 0;
            for (const period of periods) {
                if (totalMinutes >= period.start && totalMinutes < period.end) {
                    currentPeriod = period.name;
                    remainingMinutes = period.end - totalMinutes;
                    break;
                }
            }

            const periodElement = document.getElementById('period');
            const remainingElement = document.getElementById('remaining');
            if (currentPeriod) {
                periodElement.textContent = currentPeriod;
                periodElement.style.display = 'block';
                if (remainingMinutes > 0) {
                    remainingElement.textContent = '-' + remainingMinutes;
                    remainingElement.style.display = 'block';
                } else {
                    remainingElement.style.display = 'none';
                }
            } else {
                periodElement.style.display = 'none';
                remainingElement.style.display = 'none';
            }
            
            document.getElementById('time-text').textContent = timeString;
            document.getElementById('date').textContent = dateString;
            document.getElementById('weekday').textContent = weekdayString;
        }

        document.getElementById('cycleDay').addEventListener('click', () => {
            window.open('https://www.tanghin.edu.hk/en/calendar.php?wid=8$0', '_blank');
        });

        document.getElementById('time').addEventListener('click', showPeriods);

        document.getElementById('modal').addEventListener('click', (event) => {
            if (event.target === document.getElementById('modal')) {
                document.getElementById('modal').style.display = 'none';
            }
        });

        document.getElementById('closeModal').addEventListener('click', () => {
            document.getElementById('modal').style.display = 'none';
        });

        document.getElementById('layoutSwitch').addEventListener('change', (e) => {
            if (e.target.checked) {
                document.querySelector('.clock').classList.add('landscape');
            } else {
                document.querySelector('.clock').classList.remove('landscape');
            }
            updateClock(); // Refresh display after layout change
        });

        updateClock();
        setInterval(updateClock, 1000);

        document.getElementById('mode').addEventListener('change', updateClock);
    </script>
