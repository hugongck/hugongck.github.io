<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunch Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_URL = 'https://script.google.com/macros/s/AKfycbxy2q1WdKxfR9MfUigLdTHVzOaJeXV4_MY6MvwWQOOEsuLUjeaZvyFaEaKn3UbMa7r5/exec'; 

    const formatYYYYMMDD = (d) => {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getLocalYYYYMMDD = () => formatYYYYMMDD(new Date());

    const get7DaysCutoffYYYYMMDD = () => {
      const d = new Date();
      d.setDate(d.getDate() - 6); // Today + past 6 days = 7-day window
      return formatYYYYMMDD(d);
    };

    const formatDisplayDate = (dateStr) => {
      if (!dateStr) return '';
      const parts = String(dateStr).split('-');
      if (parts.length === 3) {
        const dateObj = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return `星期${days[dateObj.getDay()]} ${parts[1]}/${parts[2]}`;
      }
      return dateStr;
    };

    const sortHistoryDesc = (list) => {
      return [...list].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    };

    const normalizeRestaurants = (list) => {
      if (!Array.isArray(list)) return [];
      return list.map(item => {
        if (typeof item === 'string') return { name: item.trim(), keywords: '' };
        return { name: String(item.name || '').trim(), keywords: String(item.keywords || '').trim() };
      }).filter(item => item.name);
    };

    // Get up to 3 UNIQUE restaurants eaten strictly within the recent 7 days
    const getExcluded3InLast7Days = (historyList, todayStr, cutoff7DaysStr) => {
      const recent7 = sortHistoryDesc(historyList).filter(
        h => h.date >= cutoff7DaysStr && h.date <= todayStr && String(h.restaurant || '').trim() !== ''
      );
      const uniqueNames = [];
      const seenLower = new Set();
      for (const h of recent7) {
        const name = String(h.restaurant).trim();
        const lower = name.toLowerCase();
        if (!seenLower.has(lower)) {
          seenLower.add(lower);
          uniqueNames.push(name);
          if (uniqueNames.length === 3) break;
        }
      }
      return uniqueNames;
    };

    // When query is empty: show all rollable restaurants (excluding recent 3 unique eaten within recent 7 days)
    // When query is non-empty: search all restaurants by name or keywords
    const filterRestaurants = (list, query, excludedNames = []) => {
      const normalized = normalizeRestaurants(list);
      const q = String(query || '').trim().toLowerCase();
      
      if (!q) {
        const excludedSet = new Set(excludedNames.map(n => String(n || '').trim().toLowerCase()));
        return normalized.filter(r => !excludedSet.has(r.name.toLowerCase()));
      }
      
      return normalized.filter(r => 
        r.name.toLowerCase().includes(q) || r.keywords.toLowerCase().includes(q)
      );
    };

    function App() {
      const [data, setData] = useState(() => {
        const cached = localStorage.getItem('lunch_data');
        if (!cached) return { history: [], payments: [], restaurants: [] };
        const parsed = JSON.parse(cached);
        return { 
          ...parsed, 
          history: sortHistoryDesc(parsed.history || []),
          restaurants: normalizeRestaurants(parsed.restaurants || [])
        };
      });
      
      const [loading, setLoading] = useState(() => !localStorage.getItem('lunch_data'));
      const [uploading, setUploading] = useState(false);
      const [newName, setNewName] = useState(() => localStorage.getItem('lunch_username') || '');
      
      const [customRest, setCustomRest] = useState('');
      const [showTodaySuggestions, setShowTodaySuggestions] = useState(false);
      
      const todayStr = getLocalYYYYMMDD();
      const cutoff7DaysStr = get7DaysCutoffYYYYMMDD();
      const [selectedDate, setSelectedDate] = useState(todayStr);
      
      const [isAddingPast, setIsAddingPast] = useState(false);
      const [pastDate, setPastDate] = useState('');
      const [pastRest, setPastRest] = useState('');
      const [showPastSuggestions, setShowPastSuggestions] = useState(false);

      const pausePollingUntil = useRef(0);

      useEffect(() => {
        let isCancelled = false;

        const fetchData = async () => {
          if (Date.now() < pausePollingUntil.current) return;
          try {
            const res = await fetch(API_URL, { redirect: 'follow' });
            const json = await res.json();
            
            if (isCancelled || Date.now() < pausePollingUntil.current) return;
            
            const formattedJson = {
              ...json,
              history: sortHistoryDesc(json.history || []),
              restaurants: normalizeRestaurants(json.restaurants || [])
            };
            
            setData(formattedJson);
            localStorage.setItem('lunch_data', JSON.stringify(formattedJson));
            setLoading(false);
          } catch (e) { 
            console.error(e); 
            setLoading(false);
          }
        };
        
        fetchData();
        const interval = setInterval(fetchData, 3000);
        return () => { isCancelled = true; clearInterval(interval); };
      }, []);

      const postAction = async (payload) => {
        pausePollingUntil.current = Date.now() + 4000; 
        try {
          await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(payload) });
        } catch (e) {
          console.error("Action failed:", e);
        }
      };

      const autoAddCurrentUser = () => {
        if (!newName.trim()) return;
        setData(prev => {
          const exists = prev.payments.find(p => p.date === todayStr && p.name === newName.trim());
          if (exists) return prev;
          return {
            ...prev,
            payments: [...prev.payments, { date: todayStr, name: newName.trim(), paid: false }]
          };
        });
        postAction({ action: 'add_user', name: newName.trim(), date: todayStr });
      };

      const handleRoll = () => {
        const excluded = getExcluded3InLast7Days(data.history, todayStr, cutoff7DaysStr);
        const rollable = filterRestaurants(data.restaurants, '', excluded);
        if (rollable.length === 0) return;

        const chosen = rollable[Math.floor(Math.random() * rollable.length)].name;

        setData(prev => {
          const newHistory = [...prev.history];
          const todayIndex = newHistory.findIndex(h => h.date === todayStr);
          if (todayIndex > -1) {
            newHistory[todayIndex].restaurant = chosen;
          } else {
            newHistory.unshift({ date: todayStr, restaurant: chosen, receipt: null });
          }
          return { ...prev, history: sortHistoryDesc(newHistory) };
        });

        autoAddCurrentUser();
        postAction({ action: 'roll_restaurant', chosen });
      };

      const submitTodayRestaurant = (chosenName) => {
        const cleanName = String(chosenName || '').trim();
        if (!cleanName) return;
        
        setData(prev => {
          const newHistory = [...prev.history];
          const todayIndex = newHistory.findIndex(h => h.date === todayStr);
          if (todayIndex > -1) {
            newHistory[todayIndex].restaurant = cleanName;
          } else {
            newHistory.unshift({ date: todayStr, restaurant: cleanName, receipt: null });
          }

          const currentRests = normalizeRestaurants(prev.restaurants);
          const exists = currentRests.some(r => r.name.toLowerCase() === cleanName.toLowerCase());
          const updatedRests = exists ? currentRests : [...currentRests, { name: cleanName, keywords: '' }];

          return { ...prev, history: sortHistoryDesc(newHistory), restaurants: updatedRests };
        });
        
        autoAddCurrentUser();
        postAction({ action: 'set_restaurant', restaurant: cleanName });
        setCustomRest('');
        setShowTodaySuggestions(false);
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        submitTodayRestaurant(customRest);
      };

      const handlePastSubmit = (e) => {
        e.preventDefault();
        const cleanRest = pastRest.trim();
        if (!pastDate || !cleanRest) return;
        
        setData(prev => {
          const newHistory = [...prev.history];
          const existingIndex = newHistory.findIndex(h => h.date === pastDate);
          
          if (existingIndex > -1) {
            newHistory[existingIndex].restaurant = cleanRest;
          } else {
            newHistory.push({ date: pastDate, restaurant: cleanRest, receipt: null });
          }

          const currentRests = normalizeRestaurants(prev.restaurants);
          const exists = currentRests.some(r => r.name.toLowerCase() === cleanRest.toLowerCase());
          const updatedRests = exists ? currentRests : [...currentRests, { name: cleanRest, keywords: '' }];

          return { ...prev, history: sortHistoryDesc(newHistory), restaurants: updatedRests };
        });
        
        if (newName.trim()) {
          setData(prev => {
            const exists = prev.payments.find(p => p.date === pastDate && p.name === newName.trim());
            if (!exists) {
              return { ...prev, payments: [...prev.payments, { date: pastDate, name: newName.trim(), paid: false }] };
            }
            return prev;
          });
          postAction({ action: 'add_user', name: newName.trim(), date: pastDate });
        }
        
        postAction({ action: 'set_restaurant', restaurant: cleanRest, date: pastDate });
        
        setIsAddingPast(false);
        setPastDate('');
        setPastRest('');
        setShowPastSuggestions(false);
        setSelectedDate(pastDate);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        localStorage.setItem('lunch_username', newName.trim());
        
        setData(prev => ({
          ...prev,
          payments: [...prev.payments, { date: selectedDate, name: newName, paid: false }]
        }));
        
        postAction({ action: 'add_user', name: newName, date: selectedDate });
      };

      const handleTogglePaid = (name, currentStatus) => {
        const isPaid = currentStatus === 'TRUE' || currentStatus === true;
        
        setData(prev => ({
          ...prev,
          payments: prev.payments.map(p => 
            (p.name === name && p.date === selectedDate) ? { ...p, paid: !isPaid } : p
          )
        }));
        
        postAction({ action: 'toggle_paid', name, date: selectedDate, paid: !isPaid });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          const finalDateToUse = selectedDate || todayStr;
          
          await postAction({
            action: 'upload_receipt',
            date: finalDateToUse,
            base64: base64,
            mimeType: file.type,
            filename: `${finalDateToUse}-receipt`
          });
          
          pausePollingUntil.current = 0; 
          setUploading(false);
        };
        reader.readAsDataURL(file);
      };

      if (loading) return <div className="flex h-screen items-center justify-center font-bold text-xl">Loading...</div>;

      const sortedHistory = sortHistoryDesc(data.history);
      const currentHistory = sortedHistory.find(h => h.date === selectedDate);
      const activeRestaurant = currentHistory?.restaurant || 'Not chosen yet';
      const activeReceipt = currentHistory?.receipt;
      const activePayments = data.payments.filter(p => p.date === selectedDate);

      const excluded3InLast7Days = getExcluded3InLast7Days(sortedHistory, todayStr, cutoff7DaysStr);
      const todaySuggestions = filterRestaurants(data.restaurants, customRest, excluded3InLast7Days);
      const pastSuggestions = filterRestaurants(data.restaurants, pastRest, excluded3InLast7Days);

      return (
        <div className="max-w-md mx-auto p-4 font-sans min-h-screen pb-10 pt-6">
          
          {/* Main Display Area */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-3">
            <div className={`flex items-center ${activeRestaurant !== 'Not chosen yet' ? 'justify-between text-left' : 'justify-center text-center'}`}>
              <div>
                <p className={`text-sm ${selectedDate === todayStr ? 'text-red-600 font-bold text-base' : 'text-gray-500 font-medium'}`}>
                  {selectedDate === todayStr ? `Today (${formatDisplayDate(selectedDate)})` : formatDisplayDate(selectedDate)}
                </p>
                <h2 className="text-2xl font-bold text-gray-800 mt-1">{activeRestaurant}</h2>
              </div>

              {activeRestaurant !== 'Not chosen yet' && (
                <div className="shrink-0 ml-3">
                  {activeReceipt ? (
                    <a href={activeReceipt} target="_blank" rel="noreferrer" className="text-indigo-600 text-sm font-bold underline bg-indigo-50 px-3 py-2 rounded-lg inline-block">
                      View Image
                    </a>
                  ) : (
                    <label className={`cursor-pointer text-sm font-bold py-2 px-3 rounded-lg transition-colors inline-block ${uploading ? 'bg-gray-200 text-gray-500' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>
                      {uploading ? 'Uploading...' : '📷 Upload'}
                      <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} disabled={uploading} />
                    </label>
                  )}
                </div>
              )}
            </div>

            {selectedDate === todayStr && activeRestaurant === 'Not chosen yet' && (
              <div className="flex flex-col gap-3 mt-4">
                <form onSubmit={handleManualSubmit} className="relative">
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="Type restaurant or keyword..." 
                      className="flex-1 border p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                      value={customRest}
                      onFocus={() => setShowTodaySuggestions(true)}
                      onBlur={() => setTimeout(() => setShowTodaySuggestions(false), 180)}
                      onChange={e => {
                        setCustomRest(e.target.value);
                        setShowTodaySuggestions(true);
                      }}
                    />
                    <button type="submit" className="bg-slate-700 text-white font-bold px-4 rounded-lg shadow-md hover:bg-slate-800 transition-all">
                      Enter
                    </button>
                  </div>

                  {/* Autocomplete Dropdown */}
                  {showTodaySuggestions && todaySuggestions.length > 0 && (
                    <ul className="absolute z-20 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto divide-y divide-gray-100">
                      {!customRest.trim() && (
                        <li className="px-3.5 py-1.5 bg-gray-50 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                          Available to Roll (Excludes Recent 3 in 7 Days)
                        </li>
                      )}
                      {todaySuggestions.map((r, idx) => (
                        <li 
                          key={idx}
                          onMouseDown={() => submitTodayRestaurant(r.name)}
                          className="px-3.5 py-2.5 hover:bg-indigo-50 cursor-pointer flex justify-between items-center gap-2"
                        >
                          <span className="font-bold text-gray-800 text-sm">{r.name}</span>
                          {r.keywords && (
                            <span className="text-xs text-gray-400 truncate max-w-[45%]">{r.keywords}</span>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}
                </form>

                <div className="flex items-center gap-3 my-1">
                  <div className="flex-1 h-px bg-gray-200"></div>
                  <span className="text-xs text-gray-400 font-bold uppercase">OR</span>
                  <div className="flex-1 h-px bg-gray-200"></div>
                </div>

                <button 
                  onClick={handleRoll}
                  className="bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                >
                  唔知食咩 🎲 (Random Roll)
                </button>
                <p className="text-xs text-center text-gray-400">Excludes recent 3 (last 7 days): {excluded3InLast7Days.join(', ') || 'None'}</p>
              </div>
            )}
          </div>

          {/* Participants */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-3">
            <form onSubmit={handleAddUser} className="flex gap-2 mb-4">
              <input
                type="text"
                className="flex-1 border p-2 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                placeholder="Type name to join..."
                value={newName}
                onChange={e => setNewName(e.target.value)}
              />
              <button type="submit" className="bg-emerald-500 text-white px-5 rounded-lg font-bold shadow hover:bg-emerald-600 transition-colors">
                Add
              </button>
            </form>

            {activePayments.length > 0 ? (
              <ul className="grid grid-cols-2 gap-2">
                {activePayments.map((p, i) => {
                  const isPaid = p.paid === 'TRUE' || p.paid === true;
                  return (
                    <li key={i} className="flex justify-between items-center p-2.5 bg-gray-50 rounded-lg border border-gray-100">
                      <span className="font-medium text-gray-700 text-sm truncate pr-1">{p.name}</span>
                      <label className="flex items-center gap-1.5 cursor-pointer select-none shrink-0">
                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'}`}>
                          {isPaid ? 'PAID' : 'UNPAID'}
                        </span>
                        <input 
                          type="checkbox" 
                          checked={isPaid} 
                          onChange={() => handleTogglePaid(p.name, p.paid)}
                          className="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                        />
                      </label>
                    </li>
                  )
                })}
              </ul>
            ) : (
              <p className="text-gray-400 text-center text-sm py-2">No one added for this day.</p>
            )}
          </div>

          {/* History & Add Past Record Block */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div className="flex justify-between items-center mb-4">
              <h3 className="font-bold text-lg text-gray-700">History</h3>
              <button 
                onClick={() => setIsAddingPast(!isAddingPast)}
                className="text-indigo-600 text-xs font-bold bg-indigo-50 px-3 py-1.5 rounded-full hover:bg-indigo-100 transition-colors"
              >
                {isAddingPast ? 'Cancel' : '+ Add Past Record'}
              </button>
            </div>

            {isAddingPast && (
              <form onSubmit={handlePastSubmit} className="mb-4 p-4 bg-gray-50 border border-indigo-100 rounded-lg flex flex-col gap-3">
                <div>
                  <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Date</label>
                  <input 
                    type="date" 
                    value={pastDate} 
                    onChange={e => setPastDate(e.target.value)} 
                    className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white" 
                    required 
                    max={todayStr} 
                  />
                </div>
                <div className="relative">
                  <label className="text-xs font-bold text-gray-500 uppercase block mb-1">Restaurant</label>
                  <input 
                    type="text" 
                    value={pastRest} 
                    onFocus={() => setShowPastSuggestions(true)}
                    onBlur={() => setTimeout(() => setShowPastSuggestions(false), 180)}
                    onChange={e => {
                      setPastRest(e.target.value);
                      setShowPastSuggestions(true);
                    }} 
                    placeholder="Where did you eat?" 
                    className="w-full p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white" 
                    required 
                  />
                  {showPastSuggestions && pastSuggestions.length > 0 && (
                    <ul className="absolute z-20 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-40 overflow-y-auto divide-y divide-gray-100">
                      {!pastRest.trim() && (
                        <li className="px-3 py-1.5 bg-gray-50 text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                          Available to Roll (Excludes Recent 3 in 7 Days)
                        </li>
                      )}
                      {pastSuggestions.map((r, idx) => (
                        <li 
                          key={idx}
                          onMouseDown={() => {
                            setPastRest(r.name);
                            setShowPastSuggestions(false);
                          }}
                          className="px-3 py-2 hover:bg-indigo-50 cursor-pointer flex justify-between items-center gap-2"
                        >
                          <span className="font-bold text-gray-800 text-sm">{r.name}</span>
                          {r.keywords && (
                            <span className="text-xs text-gray-400 truncate max-w-[45%]">{r.keywords}</span>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
                <button type="submit" className="mt-1 bg-slate-700 text-white font-bold py-2 rounded-lg shadow-md hover:bg-slate-800">
                  Save Record
                </button>
              </form>
            )}

            <div className="space-y-2">
              {sortedHistory.map((h, i) => {
                const myPayment = data.payments.find(p => p.date === h.date && p.name === newName);
                const myPaidStatus = myPayment ? (myPayment.paid === 'TRUE' || myPayment.paid === true) : null;

                const isSelected = selectedDate === h.date;
                const isToday = h.date === todayStr;
                
                const bgClass = isSelected ? 'bg-indigo-50' : 'bg-gray-50 hover:bg-gray-100';
                const borderClass = isToday 
                  ? 'border-2 border-gray-800' 
                  : (isSelected ? 'border border-indigo-200' : 'border border-transparent');

                return (
                  <button 
                    key={i}
                    onClick={() => setSelectedDate(h.date)}
                    className={`w-full flex justify-between items-center p-3 rounded-lg text-left transition-colors ${bgClass} ${borderClass}`}
                  >
                    <div className="flex flex-col">
                      {isToday ? (
                        <span className="text-red-600 font-bold text-sm">Today ({formatDisplayDate(h.date)})</span>
                      ) : (
                        <span className="text-gray-500 text-sm">{formatDisplayDate(h.date)}</span>
                      )}
                      
                      {myPayment && (
                        <span className={`text-xs mt-1 font-bold ${myPaidStatus ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {myPaidStatus ? '✅ Paid' : '❌ Unpaid'}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="font-bold text-gray-700 text-right">{h.restaurant}</span>
                      {h.receipt && <span className="text-lg" title="Has receipt">📸</span>}
                    </div>
                  </button>
                );
              })}
              {sortedHistory.length === 0 && !isAddingPast && (
                <p className="text-center text-sm text-gray-400 py-4">No history records found.</p>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
