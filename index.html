<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>食咩食咩</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Fix iOS Safari native date input overflowing its container */
    input[type="date"] {
      -webkit-appearance: none;
      appearance: none;
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      min-height: 2.5rem;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 overflow-x-hidden">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const API_URL = 'https://script.google.com/macros/s/AKfycbxy2q1WdKxfR9MfUigLdTHVzOaJeXV4_MY6MvwWQOOEsuLUjeaZvyFaEaKn3UbMa7r5/exec'; 
    const DEFAULT_PARTICIPANTS = ['Hugo', 'Henry'];

    const formatYYYYMMDD = (d) => {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    const getLocalYYYYMMDD = () => formatYYYYMMDD(new Date());

    const getDaysAgoYYYYMMDD = (daysAgo) => {
      const d = new Date();
      d.setDate(d.getDate() - daysAgo);
      return formatYYYYMMDD(d);
    };

    const formatDisplayDate = (dateStr) => {
      if (!dateStr) return '';
      const parts = String(dateStr).split('-');
      if (parts.length === 3) {
        const dateObj = new Date(parts[0], parseInt(parts[1]) - 1, parts[2]);
        const days = ['日', '一', '二', '三', '四', '五', '六'];
        return `星期${days[dateObj.getDay()]} ${parts[1]}/${parts[2]}`;
      }
      return dateStr;
    };

    const sortHistoryDesc = (list) => {
      return [...list].sort((a, b) => String(b.date).localeCompare(String(a.date)));
    };

    const normalizeRestaurants = (list) => {
      if (!Array.isArray(list)) return [];
      return list.map(item => {
        if (typeof item === 'string') return { name: item.trim(), keywords: '' };
        return { name: String(item.name || '').trim(), keywords: String(item.keywords || '').trim() };
      }).filter(item => item.name);
    };

    const getExcludedPast3CalendarDays = (historyList, todayStr, cutoff3DaysStr) => {
      const recent3Days = sortHistoryDesc(historyList).filter(
        h => h.date >= cutoff3DaysStr && h.date < todayStr && String(h.restaurant || '').trim() !== ''
      );
      const uniqueNames = [];
      const seenLower = new Set();
      for (const h of recent3Days) {
        const name = String(h.restaurant).trim();
        const lower = name.toLowerCase();
        if (!seenLower.has(lower)) {
          seenLower.add(lower);
          uniqueNames.push(name);
        }
      }
      return uniqueNames;
    };

    const filterRestaurants = (list, query, excludedNames = []) => {
      const normalized = normalizeRestaurants(list);
      const q = String(query || '').trim().toLowerCase();
      
      if (!q) {
        if (!excludedNames || excludedNames.length === 0) return normalized;
        const excludedSet = new Set(excludedNames.map(n => String(n || '').trim().toLowerCase()));
        return normalized.filter(r => !excludedSet.has(r.name.toLowerCase()));
      }
      
      return normalized.filter(r => 
        r.name.toLowerCase().includes(q) || r.keywords.toLowerCase().includes(q)
      );
    };

    const getRandomIndex = (max) => {
      if (max <= 1) return 0;
      if (window.crypto && window.crypto.getRandomValues) {
        const arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return arr[0] % max;
      }
      return Math.floor(Math.random() * max);
    };

    function App() {
      const [data, setData] = useState(() => {
        const cached = localStorage.getItem('lunch_data');
        if (!cached) return { history: [], payments: [], restaurants: [] };
        const parsed = JSON.parse(cached);
        return { 
          ...parsed, 
          history: sortHistoryDesc(parsed.history || []),
          restaurants: normalizeRestaurants(parsed.restaurants || [])
        };
      });
      
      const [loading, setLoading] = useState(() => !localStorage.getItem('lunch_data'));
      const [uploading, setUploading] = useState(false);
      const [newName, setNewName] = useState(() => localStorage.getItem('lunch_username') || '');
      
      const [customRest, setCustomRest] = useState('');
      const [showTodaySuggestions, setShowTodaySuggestions] = useState(false);
      
      const todayStr = getLocalYYYYMMDD();
      const cutoff3DaysStr = getDaysAgoYYYYMMDD(3);
      const [selectedDate, setSelectedDate] = useState(todayStr);
      
      const [isAddingPast, setIsAddingPast] = useState(false);
      const [pastDate, setPastDate] = useState('');
      const [pastRest, setPastRest] = useState('');
      const [showPastSuggestions, setShowPastSuggestions] = useState(false);

      const inFlightActions = useRef(0);
      const actionSeq = useRef(0);

      const applyServerState = (rawState) => {
        if (!rawState) return;
        const formatted = {
          history: sortHistoryDesc(rawState.history || []),
          payments: rawState.payments || [],
          restaurants: normalizeRestaurants(rawState.restaurants || [])
        };
        setData(formatted);
        localStorage.setItem('lunch_data', JSON.stringify(formatted));
      };

      useEffect(() => {
        let isCancelled = false;
        let isFetching = false;

        const fetchData = async () => {
          if (inFlightActions.current > 0 || isFetching) return;
          isFetching = true;
          const seqAtStart = actionSeq.current;

          try {
            const res = await fetch(`${API_URL}?t=${Date.now()}`, { redirect: 'follow', cache: 'no-store' });
            const json = await res.json();
            
            if (isCancelled || inFlightActions.current > 0 || actionSeq.current !== seqAtStart) return;
            
            applyServerState(json);
            setLoading(false);
          } catch (e) { 
            console.error(e); 
            setLoading(false);
          } finally {
            isFetching = false;
          }
        };
        
        fetchData();
        const interval = setInterval(fetchData, 1500);
        const onVisible = () => {
          if (document.visibilityState === 'visible') fetchData();
        };
        document.addEventListener('visibilitychange', onVisible);

        return () => {
          isCancelled = true;
          clearInterval(interval);
          document.removeEventListener('visibilitychange', onVisible);
        };
      }, []);

      const postAction = async (payload) => {
        inFlightActions.current += 1;
        actionSeq.current += 1;
        const mySeq = actionSeq.current;

        try {
          const res = await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(payload) });
          const json = await res.json();
          if (json && json.state && actionSeq.current === mySeq) {
            applyServerState(json.state);
          }
        } catch (e) {
          console.error("Action failed:", e);
        } finally {
          inFlightActions.current = Math.max(0, inFlightActions.current - 1);
        }
      };

      const ensureParticipantsForDate = (targetDate) => {
        const namesToAdd = [...DEFAULT_PARTICIPANTS];
        if (newName.trim() && !namesToAdd.some(n => n.toLowerCase() === newName.trim().toLowerCase())) {
          namesToAdd.push(newName.trim());
        }

        const existingForDate = data.payments.filter(p => p.date === targetDate);
        const missingNames = namesToAdd.filter(
          name => !existingForDate.some(p => p.name.toLowerCase() === name.toLowerCase())
        );

        if (missingNames.length > 0) {
          setData(prev => ({
            ...prev,
            payments: [
              ...prev.payments,
              ...missingNames.map(name => ({ date: targetDate, name, paid: false }))
            ]
          }));
          postAction({ action: 'add_users', names: missingNames, date: targetDate });
        }
      };

      const handleRoll = () => {
        const excluded = getExcludedPast3CalendarDays(data.history, todayStr, cutoff3DaysStr);
        const rollable = filterRestaurants(data.restaurants, '', excluded);
        if (rollable.length === 0) return;

        const chosen = rollable[getRandomIndex(rollable.length)].name;

        setData(prev => {
          const newHistory = [...prev.history];
          const todayIndex = newHistory.findIndex(h => h.date === todayStr);
          if (todayIndex > -1) {
            newHistory[todayIndex] = { ...newHistory[todayIndex], restaurant: chosen };
          } else {
            newHistory.unshift({ date: todayStr, restaurant: chosen, receipt: null });
          }
          const updated = { ...prev, history: sortHistoryDesc(newHistory) };
          localStorage.setItem('lunch_data', JSON.stringify(updated));
          return updated;
        });

        ensureParticipantsForDate(todayStr);
        postAction({ action: 'roll_restaurant', chosen });
      };

      const submitTodayRestaurant = (chosenName) => {
        const cleanName = String(chosenName || '').trim();
        if (!cleanName) return;
        
        setData(prev => {
          const newHistory = [...prev.history];
          const todayIndex = newHistory.findIndex(h => h.date === todayStr);
          if (todayIndex > -1) {
            newHistory[todayIndex].restaurant = cleanName;
          } else {
            newHistory.unshift({ date: todayStr, restaurant: cleanName, receipt: null });
          }

          const currentRests = normalizeRestaurants(prev.restaurants);
          const exists = currentRests.some(r => r.name.toLowerCase() === cleanName.toLowerCase());
          const updatedRests = exists ? currentRests : [...currentRests, { name: cleanName, keywords: '' }];

          return { ...prev, history: sortHistoryDesc(newHistory), restaurants: updatedRests };
        });
        
        ensureParticipantsForDate(todayStr);
        postAction({ action: 'set_restaurant', restaurant: cleanName });
        setCustomRest('');
        setShowTodaySuggestions(false);
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        submitTodayRestaurant(customRest);
      };

      const handlePastSubmit = (e) => {
        e.preventDefault();
        const cleanRest = pastRest.trim();
        if (!pastDate || !cleanRest) return;
        
        setData(prev => {
          const newHistory = [...prev.history];
          const existingIndex = newHistory.findIndex(h => h.date === pastDate);
          
          if (existingIndex > -1) {
            newHistory[existingIndex].restaurant = cleanRest;
          } else {
            newHistory.push({ date: pastDate, restaurant: cleanRest, receipt: null });
          }

          const currentRests = normalizeRestaurants(prev.restaurants);
          const exists = currentRests.some(r => r.name.toLowerCase() === cleanRest.toLowerCase());
          const updatedRests = exists ? currentRests : [...currentRests, { name: cleanRest, keywords: '' }];

          return { ...prev, history: sortHistoryDesc(newHistory), restaurants: updatedRests };
        });
        
        ensureParticipantsForDate(pastDate);
        postAction({ action: 'set_restaurant', restaurant: cleanRest, date: pastDate });
        
        setIsAddingPast(false);
        setPastDate('');
        setPastRest('');
        setShowPastSuggestions(false);
        setSelectedDate(pastDate);
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        const cleanUser = newName.trim();
        if (!cleanUser) return;
        localStorage.setItem('lunch_username', cleanUser);
        
        const alreadyExists = data.payments.some(
          p => p.date === selectedDate && p.name.toLowerCase() === cleanUser.toLowerCase()
        );
        if (alreadyExists) return;

        setData(prev => ({
          ...prev,
          payments: [...prev.payments, { date: selectedDate, name: cleanUser, paid: false }]
        }));
        
        postAction({ action: 'add_users', names: [cleanUser], date: selectedDate });
      };

      const handleRemoveUser = (nameToRemove) => {
        setData(prev => ({
          ...prev,
          payments: prev.payments.filter(
            p => !(p.date === selectedDate && p.name.toLowerCase() === nameToRemove.toLowerCase())
          )
        }));
        postAction({ action: 'remove_user', name: nameToRemove, date: selectedDate });
      };

      const handleTogglePaid = (name, currentStatus) => {
        const isPaid = currentStatus === 'TRUE' || currentStatus === true;
        
        setData(prev => ({
          ...prev,
          payments: prev.payments.map(p => 
            (p.name === name && p.date === selectedDate) ? { ...p, paid: !isPaid } : p
          )
        }));
        
        postAction({ action: 'toggle_paid', name, date: selectedDate, paid: !isPaid });
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          const finalDateToUse = selectedDate || todayStr;
          
          await postAction({
            action: 'upload_receipt',
            date: finalDateToUse,
            base64: base64,
            mimeType: file.type,
            filename: `${finalDateToUse}-receipt`
          });
          
          setUploading(false);
        };
        reader.readAsDataURL(file);
      };

      if (loading) return <div className="flex h-screen items-center justify-center font-bold text-xl">載入中...</div>;

      const sortedHistory = sortHistoryDesc(data.history);
      const currentHistory = sortedHistory.find(h => h.date === selectedDate);
      const activeRestaurant = currentHistory?.restaurant || '食咩食咩';
      const activeReceipt = currentHistory?.receipt;
      
      const rawActivePayments = data.payments.filter(p => p.date === selectedDate);
      const activePayments = (rawActivePayments.length === 0 && selectedDate === todayStr && activeRestaurant === '食咩食咩')
        ? DEFAULT_PARTICIPANTS.map(name => ({ date: todayStr, name, paid: false }))
        : rawActivePayments;

      const excludedPast3Days = getExcludedPast3CalendarDays(sortedHistory, todayStr, cutoff3DaysStr);
      const todaySuggestions = filterRestaurants(data.restaurants, customRest, excludedPast3Days);
      const pastSuggestions = filterRestaurants(data.restaurants, pastRest, []);

      return (
        <div className="max-w-md mx-auto p-4 font-sans min-h-screen pb-10 pt-6">
          
          {/* Main Display Area */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-3 overflow-hidden">
            <div className={`flex items-center gap-3 ${activeRestaurant !== '食咩食咩' ? 'justify-between text-left' : 'justify-center text-center'}`}>
              <div className="min-w-0 flex-1">
                <p className={`text-sm ${selectedDate === todayStr ? 'text-red-600 font-bold text-base' : 'text-gray-500 font-medium'}`}>
                  {selectedDate === todayStr ? `今日 (${formatDisplayDate(selectedDate)})` : formatDisplayDate(selectedDate)}
                </p>
                <h2 className="text-2xl font-bold text-gray-800 mt-1 break-words">{activeRestaurant}</h2>
              </div>

              {activeRestaurant !== '食咩食咩' && (
                <div className="shrink-0">
                  {activeReceipt ? (
                    <a href={activeReceipt} target="_blank" rel="noreferrer" className="text-indigo-600 text-sm font-bold underline bg-indigo-50 px-3 py-2 rounded-lg inline-block">
                      睇單據
                    </a>
                  ) : (
                    <label className={`cursor-pointer text-sm font-bold py-2 px-3 rounded-lg transition-colors inline-block ${uploading ? 'bg-gray-200 text-gray-500' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>
                      {uploading ? '上載中...' : '📷 上載'}
                      <input type="file" accept="image/*" className="hidden" onChange={handleFileUpload} disabled={uploading} />
                    </label>
                  )}
                </div>
              )}
            </div>

            {selectedDate === todayStr && activeRestaurant === '食咩食咩' && (
              <div className="flex flex-col gap-3 mt-4">
                <form onSubmit={handleManualSubmit} className="relative">
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      placeholder="輸入餐廳或者關鍵字..." 
                      className="min-w-0 flex-1 border p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                      value={customRest}
                      onFocus={() => setShowTodaySuggestions(true)}
                      onBlur={() => setTimeout(() => setShowTodaySuggestions(false), 180)}
                      onChange={e => {
                        setCustomRest(e.target.value);
                        setShowTodaySuggestions(true);
                      }}
                    />
                    <button type="submit" title="確定" className="shrink-0 bg-slate-700 text-white font-bold px-4 rounded-lg shadow-md hover:bg-slate-800 transition-all text-lg">
                      ↵
                    </button>
                  </div>

                  {/* Autocomplete Dropdown */}
                  {showTodaySuggestions && todaySuggestions.length > 0 && (
                    <ul className="absolute z-20 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-48 overflow-y-auto divide-y divide-gray-100">
                      {todaySuggestions.map((r, idx) => (
                        <li 
                          key={idx}
                          onMouseDown={() => submitTodayRestaurant(r.name)}
                          className="px-3.5 py-2.5 hover:bg-indigo-50 cursor-pointer flex justify-between items-center gap-2"
                        >
                          <span className="font-bold text-gray-800 text-sm">{r.name}</span>
                          {r.keywords && (
                            <span className="text-xs text-gray-400 truncate max-w-[45%]">{r.keywords}</span>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}
                </form>

                <button 
                  type="button"
                  onClick={handleRoll}
                  className="bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                >
                  唔知食咩 🎲
                </button>
                {excludedPast3Days.length > 0 && (
                  <p className="text-xs text-center text-gray-400">
                    {excludedPast3Days.map(name => `-${name}`).join(' ')}
                  </p>
                )}
              </div>
            )}
          </div>

          {/* Participants */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-3">
            <form onSubmit={handleAddUser} className="flex gap-2 mb-4">
              <input
                type="text"
                className="min-w-0 flex-1 border p-2 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                placeholder="人名"
                value={newName}
                onChange={e => setNewName(e.target.value)}
              />
              <button type="submit" title="加入" className="shrink-0 bg-emerald-500 text-white px-5 rounded-lg font-bold shadow hover:bg-emerald-600 transition-colors text-xl leading-none">
                +
              </button>
            </form>

            {activePayments.length > 0 ? (
              <ul className="grid grid-cols-2 gap-2">
                {activePayments.map((p, i) => {
                  const isPaid = p.paid === 'TRUE' || p.paid === true;
                  return (
                    <li key={i} className="relative flex justify-between items-center p-2.5 pt-3 bg-gray-50 rounded-lg border border-gray-100 min-w-0">
                      <button
                        type="button"
                        onClick={() => handleRemoveUser(p.name)}
                        title="刪除"
                        className="absolute -top-1.5 -left-1.5 w-4 h-4 rounded-full bg-gray-300 hover:bg-rose-500 text-white text-[10px] font-bold flex items-center justify-center leading-none shadow-sm transition-colors"
                      >
                        ×
                      </button>
                      <span className="font-medium text-gray-700 text-sm truncate pr-1">{p.name}</span>
                      <label className="flex items-center gap-1.5 cursor-pointer select-none shrink-0">
                        <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'}`}>
                          {isPaid ? '俾咗' : '未俾'}
                        </span>
                        <input 
                          type="checkbox" 
                          checked={isPaid} 
                          onChange={() => handleTogglePaid(p.name, p.paid)}
                          className="w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                        />
                      </label>
                    </li>
                  )
                })}
              </ul>
            ) : (
              <p className="text-gray-400 text-center text-sm py-2">0人到場</p>
            )}
          </div>

          {/* History & Add Past Record Block */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <div className="space-y-2">
              {sortedHistory.map((h, i) => {
                const myPayment = data.payments.find(p => p.date === h.date && p.name.toLowerCase() === newName.trim().toLowerCase());
                const myPaidStatus = myPayment ? (myPayment.paid === 'TRUE' || myPayment.paid === true) : null;

                const isSelected = selectedDate === h.date;
                const isToday = h.date === todayStr;
                
                const bgClass = isSelected ? 'bg-indigo-50' : 'bg-gray-50 hover:bg-gray-100';
                const borderClass = isSelected ? 'border-2 border-gray-800' : 'border border-transparent';

                return (
                  <button 
                    key={i}
                    onClick={() => setSelectedDate(h.date)}
                    className={`w-full flex justify-between items-center gap-2 p-3 rounded-lg text-left transition-colors overflow-hidden ${bgClass} ${borderClass}`}
                  >
                    <div className="flex flex-col shrink-0">
                      {isToday ? (
                        <span className="text-red-600 font-bold text-sm">今日 ({formatDisplayDate(h.date)})</span>
                      ) : (
                        <span className="text-gray-500 text-sm">{formatDisplayDate(h.date)}</span>
                      )}
                      
                      {myPayment && (
                        <span className={`text-xs mt-1 font-bold ${myPaidStatus ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {myPaidStatus ? '✅ 俾咗' : '❌ 未俾'}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-1.5 min-w-0">
                      <span className="font-bold text-gray-700 text-right truncate">{h.restaurant}</span>
                      {h.receipt && <span className="text-lg shrink-0" title="有單據">📸</span>}
                    </div>
                  </button>
                );
              })}
              {sortedHistory.length === 0 && !isAddingPast && (
                <p className="text-center text-sm text-gray-400 py-4">暫時未有紀錄</p>
              )}
            </div>

            {isAddingPast && (
              <form onSubmit={handlePastSubmit} className="mt-4 p-4 bg-gray-50 border border-indigo-100 rounded-lg flex flex-col gap-3 overflow-hidden">
                <div className="w-full min-w-0">
                  <input 
                    type="date" 
                    value={pastDate} 
                    onChange={e => setPastDate(e.target.value)} 
                    className="w-full max-w-full min-w-0 p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm" 
                    required 
                    max={todayStr} 
                  />
                </div>
                <div className="relative w-full min-w-0">
                  <input 
                    type="text" 
                    value={pastRest} 
                    onFocus={() => setShowPastSuggestions(true)}
                    onBlur={() => setTimeout(() => setShowPastSuggestions(false), 180)}
                    onChange={e => {
                      setPastRest(e.target.value);
                      setShowPastSuggestions(true);
                    }} 
                    placeholder="餐廳" 
                    className="w-full min-w-0 p-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-sm" 
                    required 
                  />
                  {showPastSuggestions && pastSuggestions.length > 0 && (
                    <ul className="absolute z-20 left-0 right-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg max-h-40 overflow-y-auto divide-y divide-gray-100">
                      {pastSuggestions.map((r, idx) => (
                        <li 
                          key={idx}
                          onMouseDown={() => {
                            setPastRest(r.name);
                            setShowPastSuggestions(false);
                          }}
                          className="px-3 py-2 hover:bg-indigo-50 cursor-pointer flex justify-between items-center gap-2"
                        >
                          <span className="font-bold text-gray-800 text-sm">{r.name}</span>
                          {r.keywords && (
                            <span className="text-xs text-gray-400 truncate max-w-[45%]">{r.keywords}</span>
                          )}
                        </li>
                      ))}
                    </ul>
                  )}
                </div>
                <button type="submit" className="mt-1 bg-slate-700 text-white font-bold py-2 rounded-lg shadow-md hover:bg-slate-800">
                  儲存
                </button>
              </form>
            )}

            <div className="mt-3 flex justify-center">
              <button 
                onClick={() => setIsAddingPast(!isAddingPast)}
                title={isAddingPast ? '取消' : '補錄'}
                className="w-9 h-9 rounded-full bg-indigo-50 text-indigo-600 font-bold text-xl flex items-center justify-center hover:bg-indigo-100 transition-colors leading-none"
              >
                {isAddingPast ? '×' : '+'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
