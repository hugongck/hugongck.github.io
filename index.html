<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunch Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const API_URL = 'https://script.google.com/macros/s/AKfycbxy2q1WdKxfR9MfUigLdTHVzOaJeXV4_MY6MvwWQOOEsuLUjeaZvyFaEaKn3UbMa7r5/exec'; 

    // Safer local timezone calculator for the backend (YYYY-MM-DD)
    const getLocalYYYYMMDD = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    // Bulletproof normalizer: cleans up messy backend dates (like "Wed Nov 18 2026...") into YYYY-MM-DD
    const normalizeDate = (dStr) => {
      if (!dStr) return '';
      // If it's already YYYY-MM-DD, leave it alone
      if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return dStr;
      
      // If it's a messy string, parse it properly
      const d = new Date(dStr);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    };

    // Formatter to show "星期X MM/DD" on the UI
    const formatDisplayDate = (dateStr) => {
      if (!dateStr) return '';
      const parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      const [y, m, d] = parts;
      
      const dateObj = new Date(y, m - 1, d);
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      const weekDay = days[dateObj.getDay()];
      
      return `星期${weekDay} ${m}/${d}`;
    };

    function App() {
      const [data, setData] = useState(() => {
        const cached = localStorage.getItem('lunch_data');
        return cached ? JSON.parse(cached) : { history: [], payments: [], restaurants: [] };
      });
      
      const [loading, setLoading] = useState(() => !localStorage.getItem('lunch_data'));
      const [uploading, setUploading] = useState(false);
      
      const [newName, setNewName] = useState(() => localStorage.getItem('lunch_username') || '');
      const [customRest, setCustomRest] = useState('');
      
      const todayStr = getLocalYYYYMMDD();
      const [selectedDate, setSelectedDate] = useState(todayStr);

      useEffect(() => {
        const fetchData = async () => {
          try {
            const res = await fetch(API_URL, { redirect: 'follow' });
            const json = await res.json();
            
            // Instantly clean up dates coming from the backend
            json.history = json.history.map(h => ({ ...h, date: normalizeDate(h.date) }));
            json.payments = json.payments.map(p => ({ ...p, date: normalizeDate(p.date) }));
            
            setData(json);
            localStorage.setItem('lunch_data', JSON.stringify(json));
            setLoading(false);
          } catch (e) { 
            console.error(e); 
            setLoading(false);
          }
        };
        fetchData();
        const interval = setInterval(fetchData, 3000);
        return () => clearInterval(interval);
      }, []);

      const postAction = async (payload) => {
        await fetch(API_URL, { method: 'POST', redirect: 'follow', body: JSON.stringify(payload) });
      };

      // Helper to auto-add the user who initiated the lunch
      const autoAddCurrentUser = () => {
        if (!newName.trim()) return;
        postAction({ action: 'add_user', name: newName.trim(), date: todayStr });
        
        setData(prev => {
          const exists = prev.payments.find(p => p.date === todayStr && p.name === newName.trim());
          if (exists) return prev;
          return {
            ...prev,
            payments: [...prev.payments, { date: todayStr, name: newName.trim(), paid: false }]
          };
        });
      };

      const handleRoll = () => {
        postAction({ action: 'roll_restaurant' });
        autoAddCurrentUser(); // Auto-join the creator
      };

      const handleManualSubmit = (e) => {
        e.preventDefault();
        if (!customRest.trim()) return;
        
        postAction({ action: 'set_restaurant', restaurant: customRest.trim() });
        autoAddCurrentUser(); // Auto-join the creator
        
        setData(prev => {
          const newHistory = [...prev.history];
          const todayIndex = newHistory.findIndex(h => h.date === todayStr);
          if (todayIndex > -1) {
            newHistory[todayIndex].restaurant = customRest.trim();
          } else {
            newHistory.unshift({ date: todayStr, restaurant: customRest.trim(), receipt: null });
          }
          return { ...prev, history: newHistory };
        });
        
        setCustomRest('');
      };

      const handleAddUser = (e) => {
        e.preventDefault();
        if (!newName.trim()) return;
        localStorage.setItem('lunch_username', newName.trim());
        
        postAction({ action: 'add_user', name: newName, date: selectedDate });
        
        setData(prev => ({
          ...prev,
          payments: [...prev.payments, { date: selectedDate, name: newName, paid: false }]
        }));
      };

      const handleTogglePaid = (name, currentStatus) => {
        const isPaid = currentStatus === 'TRUE' || currentStatus === true;
        postAction({ action: 'toggle_paid', name, date: selectedDate, paid: !isPaid });
        
        setData(prev => ({
          ...prev,
          payments: prev.payments.map(p => 
            (p.name === name && p.date === selectedDate) ? { ...p, paid: !isPaid } : p
          )
        }));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);

        const reader = new FileReader();
        reader.onload = async (ev) => {
          const base64 = ev.target.result;
          await postAction({
            action: 'upload_receipt',
            date: selectedDate,
            base64: base64,
            mimeType: file.type,
            filename: `${selectedDate}-receipt`
          });
          setUploading(false);
        };
        reader.readAsDataURL(file);
      };

      if (loading) return <div className="flex h-screen items-center justify-center font-bold text-xl">Loading...</div>;

      const currentHistory = data.history.find(h => h.date === selectedDate);
      const activeRestaurant = currentHistory?.restaurant || 'Not chosen yet';
      const activeReceipt = currentHistory?.receipt;
      const activePayments = data.payments.filter(p => p.date === selectedDate);
      const last3Days = data.history.slice(0, 3).map(h => h.restaurant);

      return (
        <div className="max-w-md mx-auto p-4 font-sans min-h-screen pb-10">
          <h1 className="text-3xl font-bold text-center mb-6 text-indigo-600 mt-4">Lunch Tracker 🍱</h1>

          {/* Main Action Card */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <div className="text-center mb-4">
              <p className={`text-sm ${selectedDate === todayStr ? 'text-red-600 font-bold text-base' : 'text-gray-500 font-medium'}`}>
                {selectedDate === todayStr ? `Today (${formatDisplayDate(selectedDate)})` : formatDisplayDate(selectedDate)}
              </p>
              <h2 className="text-2xl font-bold text-gray-800 mt-1">{activeRestaurant}</h2>
            </div>

            {/* ONLY show inputs if today is selected AND no restaurant has been chosen yet */}
            {selectedDate === todayStr && activeRestaurant === 'Not chosen yet' && (
              <div className="flex flex-col gap-3 mb-4">
                <form onSubmit={handleManualSubmit} className="flex gap-2">
                  <input 
                    type="text" 
                    placeholder="Type specific restaurant..." 
                    className="flex-1 border p-3 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                    value={customRest}
                    onChange={e => setCustomRest(e.target.value)}
                  />
                  <button type="submit" className="bg-slate-700 text-white font-bold px-4 rounded-lg shadow-md hover:bg-slate-800 transition-all">
                    Enter
                  </button>
                </form>

                <div className="flex items-center gap-3 my-1">
                  <div className="flex-1 h-px bg-gray-200"></div>
                  <span className="text-xs text-gray-400 font-bold uppercase">OR</span>
                  <div className="flex-1 h-px bg-gray-200"></div>
                </div>

                <button 
                  onClick={handleRoll}
                  className="bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md hover:bg-indigo-700 active:scale-95 transition-all"
                >
                  唔知食咩 🎲 (Random Roll)
                </button>
                <p className="text-xs text-center text-gray-400">Excludes past 3 days: {last3Days.join(', ') || 'None'}</p>
              </div>
            )}

            {/* Receipt Section */}
            {activeRestaurant !== 'Not chosen yet' && (
              <div className="border-t pt-4 mt-2 flex items-center justify-between">
                <span className="text-sm font-semibold text-gray-600">Receipt</span>
                {activeReceipt ? (
                  <a href={activeReceipt} target="_blank" rel="noreferrer" className="text-indigo-600 text-sm font-bold underline bg-indigo-50 px-3 py-1 rounded-full">
                    View Image
                  </a>
                ) : (
                  <label className={`cursor-pointer text-sm font-bold py-2 px-4 rounded-lg transition-colors ${uploading ? 'bg-gray-200 text-gray-500' : 'bg-gray-100 hover:bg-gray-200 text-gray-700'}`}>
                    {uploading ? 'Uploading...' : '📷 Snap / Upload'}
                    <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleFileUpload} disabled={uploading} />
                  </label>
                )}
              </div>
            )}
          </div>

          {/* Participants & Payments */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 mb-6">
            <h3 className="font-bold text-lg mb-4 text-gray-700">Participants</h3>
            <form onSubmit={handleAddUser} className="flex gap-2 mb-4">
              <input
                type="text"
                className="flex-1 border p-2 rounded-lg bg-gray-50 focus:ring-2 focus:ring-indigo-500 outline-none"
                placeholder="Type name to join..."
                value={newName}
                onChange={e => setNewName(e.target.value)}
              />
              <button type="submit" className="bg-emerald-500 text-white px-5 rounded-lg font-bold shadow hover:bg-emerald-600 transition-colors">
                Add
              </button>
            </form>

            <ul className="space-y-2">
              {activePayments.map((p, i) => {
                const isPaid = p.paid === 'TRUE' || p.paid === true;
                return (
                  <li key={i} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                    <span className="font-medium text-gray-700">{p.name}</span>
                    <label className="flex items-center gap-3 cursor-pointer select-none">
                      <span className={`text-xs font-bold px-2 py-1 rounded-full ${isPaid ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-600'}`}>
                        {isPaid ? 'PAID' : 'UNPAID'}
                      </span>
                      <input 
                        type="checkbox" 
                        checked={isPaid} 
                        onChange={() => handleTogglePaid(p.name, p.paid)}
                        className="w-5 h-5 text-indigo-600 rounded focus:ring-indigo-500 cursor-pointer"
                      />
                    </label>
                  </li>
                )
              })}
              {activePayments.length === 0 && <p className="text-gray-400 text-center text-sm py-2">No one added for this day.</p>}
            </ul>
          </div>

          {/* 7-Day History */}
          <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
            <h3 className="font-bold text-lg mb-4 text-gray-700">Past 7 Days</h3>
            <div className="space-y-2">
              {data.history.map((h, i) => {
                const myPayment = data.payments.find(p => p.date === h.date && p.name === newName);
                const myPaidStatus = myPayment ? (myPayment.paid === 'TRUE' || myPayment.paid === true) : null;

                return (
                  <button 
                    key={i}
                    onClick={() => setSelectedDate(h.date)}
                    className={`w-full flex justify-between items-center p-3 rounded-lg text-left transition-colors ${selectedDate === h.date ? 'bg-indigo-50 border border-indigo-200' : 'bg-gray-50 hover:bg-gray-100 border border-transparent'}`}
                  >
                    <div className="flex flex-col">
                      {h.date === todayStr ? (
                        <span className="text-red-600 font-bold text-sm">Today ({formatDisplayDate(h.date)})</span>
                      ) : (
                        <span className="text-gray-500 text-sm">{formatDisplayDate(h.date)}</span>
                      )}
                      
                      {myPayment && (
                        <span className={`text-xs mt-1 font-bold ${myPaidStatus ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {myPaidStatus ? '✅ Paid' : '❌ Unpaid'}
                        </span>
                      )}
                    </div>

                    <div className="flex items-center gap-2">
                      <span className="font-bold text-gray-700">{h.restaurant}</span>
                      {h.receipt && <span className="text-lg" title="Has receipt">📸</span>}
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
